name: Firestore Rules emulator tests

on:
  push:
    branches:
      - main
      - "test/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firestore-rules:
    name: Firestore security rules integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/firestore-rules/package.json

      - name: Install Rules test dependencies
        working-directory: tests/firestore-rules
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules tests in the Emulator
        run: >
          npx --yes firebase-tools@15.34.1 emulators:exec
          --only firestore
          --project demo-cesenaremembers
          "npm --prefix tests/firestore-rules test"
