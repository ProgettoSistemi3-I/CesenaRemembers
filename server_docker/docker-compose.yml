services:
  # 1. MICROSERVIZIO QUIZ (Python)
  quiz-server:
    build: 
      context: ./quiz-service
    container_name: cesena-quiz-server
    ports:
      - "8000:8000" # Porta esposta su internet tramite Ngrok
    env_file:
      - ./quiz-service/.env # Chiave provider LLM, esclusa dal repository
    environment:
      QUIZ_RATE_LIMIT_PER_MINUTE: "30"
      QUIZ_RATE_LIMIT_MAX_CLIENTS: "10000"
      # Impostare l'IP effettivo del proxy/tunnel che raggiunge il container.
      # Non usare '*' su una porta direttamente esposta a Internet.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    restart: unless-stopped

  # 2. MICROSERVIZIO NOTIFICHE (Node.js)
  notifier-service:
    build:
      context: ./notifier-service
    container_name: cesena-notifier-service
    environment:
      FIREBASE_SERVICE_ACCOUNT_PATH: /run/secrets/firebase-service-account.json
    volumes:
      - ./notifier-service/serviceAccountKey.json:/run/secrets/firebase-service-account.json:ro
    # Nessuna porta esposta, lavora in background ascoltando Firestore
    restart: unless-stopped