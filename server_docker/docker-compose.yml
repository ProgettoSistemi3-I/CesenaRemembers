services:
  # 0. REVERSE PROXY GATEWAY (Nginx)
  # Riceve tutte le richieste HTTPS sulla porta 8000 e le smista:
  # - /api/generate-quiz e / -> a quiz-server (Cesena Remembers)
  # - /api/                  -> a uniklas-backend (UniKlas)
  gateway:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    image: nginx:alpine
    container_name: cesena-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro   # server.crt + server.key (generati con openssl, NON nel repo)
    depends_on:
      - quiz-server
      - uniklas-backend
    networks:
      - default
      - quiz-backend

  # 1. MICROSERVIZIO QUIZ (Python) - Inalterato, riceve le richieste da Nginx
  quiz-server:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    build: 
      context: ./quiz-service
    container_name: cesena-quiz-server
    expose:
      - "8000"
    env_file:
      - ./quiz-service/.env
    environment:
      QUIZ_RATE_LIMIT_PER_MINUTE: "30"
      QUIZ_RATE_LIMIT_MAX_CLIENTS: "10000"
      FORWARDED_ALLOW_IPS: "*"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-auth-reader.json
    volumes:
      # Account di servizio separato e read-only (ruolo Firebase Authentication Viewer).
      - type: bind
        source: ./quiz-service/firebase-auth-reader.json
        target: /run/secrets/firebase-auth-reader.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - quiz-backend

  # 2. MICROSERVIZIO NOTIFICHE (Node.js) - Push localizzate in base alla lingua del destinatario
  notifier-service:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    build: 
      context: ./notifier-service
    container_name: cesena-notifier-service
    restart: unless-stopped
    volumes:
      # La chiave resta fuori dall'immagine e dal repository; montaggio read-only.
      - type: bind
        source: ./notifier-service/serviceAccountKey.json
        target: /usr/src/app/serviceAccountKey.json
        read_only: true
        bind:
          create_host_path: false

  # 3. BACKEND UNIKLAS (.NET 9 C#) - Nuovo servizio isolato
  uniklas-backend:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    build:
      context: ./uniklas-backend
      dockerfile: Dockerfile
    container_name: uniklas-backend
    expose:
      - "5000"
    restart: unless-stopped


networks:
  # Isola Uvicorn dagli altri container: soltanto Nginx condivide la rete
  # del quiz, perciò è l'unico peer da cui accettare gli header forwarded.
  quiz-backend:
    driver: bridge
