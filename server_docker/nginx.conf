# Rate limiting (per IP reale del client)
limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=20r/s;
limit_req_zone $binary_remote_addr zone=quiz_limit:10m rate=30r/m;

server {
    listen 8000 ssl;
    http2 on;
    server_name pascal.ispascalcomandini.it;
    server_tokens off;

    # Certificato self-signed generato sul server in ./certs (vedi sotto)
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    # Ereditati da tutti i location (nessuno ridefinisce proxy_set_header)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # NON accodare l'header del client: sovrascrivere, altrimenti il rate limit si aggira
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Quiz Cesena Remembers (chiama l'LLM: limite stretto)
    location /api/generate-quiz {
        limit_req zone=quiz_limit burst=10 nodelay;
        proxy_pass http://quiz-server:8000;
    }

    # API UniKlas (.NET). Swagger non e' piu' esposto.
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;
        proxy_pass http://uniklas-backend:5000;
    }

    location /health { proxy_pass http://quiz-server:8000; }
    location /       { proxy_pass http://quiz-server:8000; }
}
