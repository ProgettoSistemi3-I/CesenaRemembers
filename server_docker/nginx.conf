# Rate limiting per IP reale del client: API quiz Cesena Remembers.
limit_req_zone $binary_remote_addr zone=quiz_limit:10m rate=30r/m;

server {
    listen 8000 ssl;
    http2 on;
    server_name pascal.ispascalcomandini.it;
    server_tokens off;

    # Docker embedded DNS; re-resolve the service after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $quiz_backend quiz-server:8000;

    # Certificato self-signed generato sul server in ./certs (vedi sotto)
    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    # Ereditati da tutti i location (nessuno ridefinisce proxy_set_header)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # NON accodare l'header del client: sovrascrivere, altrimenti il rate limit si aggira
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Unico endpoint API pubblico: generazione quiz di Cesena Remembers.
    location = /api/generate-quiz {
        limit_req zone=quiz_limit burst=10 nodelay;
        proxy_pass http://$quiz_backend;
    }

    # Nessun altro servizio API è esposto da questo gateway.
    location = /api {
        return 404;
    }

    location ^~ /api/ {
        return 404;
    }

    location = /health {
        proxy_pass http://$quiz_backend;
    }

    # Fail closed: do not expose implicit FastAPI routes through the gateway.
    location / {
        return 404;
    }
}
