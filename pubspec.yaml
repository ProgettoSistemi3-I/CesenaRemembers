name: cesena_remembers
description: "Tour storici interattivi e quiz per Cesena Remembers."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_svg: ^2.0.0
  cupertino_icons: ^1.0.8
  
  # PLUGIN AGGIORNATI PER RISOLVERE L'ERRORE SU CODEMAGIC:
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  
  google_sign_in: ^6.2.1
  get_it: ^9.2.1
  flutter_map: ^8.2.2
  flutter_map_location_marker: ^10.2.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  http_cache_file_store: ^2.0.1
  flutter_map_cache: ^2.1.0
  dio_cache_interceptor: ^4.0.6
  http: ^1.6.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.1"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/icon/splash_image.png
    - assets/icon/diplo_logo.png
    - assets/icon/logoScuola.png
    - assets/loginView.png
    - assets/avatars/
    - assets/achievements/
    - assets/images/pois/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
