name: cesena_remembers
description: "Tour storici interattivi e quiz per Cesena Remembers."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.8.0
  intl: ^0.20.2
  flutter_svg: ^2.0.0
  cupertino_icons: ^1.0.8
  
  # PLUGIN AGGIORNATI PER RISOLVERE L'ERRORE SU CODEMAGIC:
  firebase_core: ^4.15.1
  firebase_auth: ^6.7.1
  cloud_firestore: ^6.10.1
  firebase_messaging: ^16.7.1
  firebase_crashlytics: ^5.4.1
  
  google_sign_in: ^6.2.1
  get_it: ^9.2.1
  flutter_map: ^8.2.2
  flutter_map_location_marker: ^10.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  http_cache_file_store: ^2.0.1
  flutter_map_cache: ^2.1.0
  dio_cache_interceptor: ^4.0.6
  http: ^1.6.0
  path_provider: ^2.1.0
  shared_preferences: ^2.3.3
  flutter_local_notifications: ^18.0.1
  package_info_plus: ^10.2.2
  firebase_app_check: ^0.4.9

# Keep the endorsed Android implementation compatible with AGP 9 built-in Kotlin.
# shared_preferences_android 2.4.24 is the first release with built-in Kotlin support.
dependency_overrides:
  shared_preferences_android: ^2.4.24
  url_launcher_android: ^6.3.31

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.14.1"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/icon/splash_image.png
    - assets/icon/diplo_logo.png
    - assets/icon/logoScuola.png
    - assets/loginView.png
    - assets/avatars/
    - assets/achievements/
    - assets/images/pois/
    - assets/certs/server.crt

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/app_icon.png"
