workflows:
  ios-workflow:
    name: Flutter iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Installa dipendenze Flutter
        script: |
          flutter pub get
      - name: Builda archivio iOS (senza firma)
        script: |
          flutter build ipa --release --no-codesign
      - name: Crea pacchetto .ipa da archivio non firmato
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r -q CesenaRemembers_unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive