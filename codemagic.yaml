workflows:
  ios-workflow:
    name: Flutter iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Installa e aggiorna dipendenze Flutter
        script: |
          flutter packages pub get
          flutter pub upgrade firebase_core cloud_firestore
      - name: Builda l'app in modalita release (senza codice di firma)
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/archive/*.xcarchive
